model: 
  name: unet3d
  type: cnn
  model_size: 499153191

framework: pytorch

workflow:
  generate_data: False
  train: True
  checkpoint: True

dataset: 
  data_folder: data/unet3d/
  format: hdf5
  num_files_train: 168
  num_samples_per_file: 1
  record_length_bytes: 104857600
  record_length_bytes_stdev: 0
  record_length_bytes_resize: 104857600
  
reader: 
  data_loader: pytorch
  batch_size: 7
  read_threads: 0
  file_shuffle: seed
  sample_shuffle: seed

train:
  epochs: 5
  computation_time: 0.636

checkpoint:
  checkpoint_folder: checkpoints/unet3d
  checkpoint_after_epoch: 5
  epochs_between_checkpoints: 2

metric:
  au: 0.90
